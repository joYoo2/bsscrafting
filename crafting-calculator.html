<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee Swarm Simulator Macro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Bee Swarm Simulator Macro</h1>

        <div class="recipe-selector">
            <h2>Add Crafting Materials</h2>
            <div class="selected-recipes" id="selectedRecipes"></div>
            <div class="input-group" style="margin-top: 15px;">
                <button class="add-recipe-btn" onclick="addRecipe()">Add to List</button>
            </div>
            <div style="margin-top: 15px;">
                <button onclick="calculate()">Calculate</button>
                <button onclick="clearRecipes()" style="background: #666;">Clear List</button>
            </div>
        </div>

        <div class="inventory-section">
            <h2>Your Inventory</h2>
            <div style="margin-bottom: 15px; display: flex; gap: 10px;">
                <button onclick="exportInventory()">Export Inventory</button>
                <button onclick="importInventory()" style="background: #2196F3;">Import Inventory</button>
                <button onclick="clearInventory()" style="background: #f44336;">Clear Inventory</button>
            </div>
            <div class="inventory-grid" id="inventoryGrid"></div>
        </div>

        <div class="results-section hidden" id="resultsSection">
            <h2>Materials Needed</h2>
            <table class="materials-table" id="materialsTable">
                <thead>
                    <tr>
                        <th>Material</th>
                        <th>Original Need</th>
                        <th>Need (with inventory)</th>
                        <th>Have</th>
                        <th>Still Need</th>
                        <th>Progress</th>
                    </tr>
                </thead>
                <tbody id="materialsTableBody"></tbody>
            </table>

            <h2 style="margin-top: 30px;">Crafting Tree</h2>
            <div id="craftingTree" style="background: #fafafa; padding: 20px; border-radius: 6px; overflow-x: auto;"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
